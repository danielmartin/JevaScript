name = "JevaScript"
grammar = "jevascript"
path_suffixes = ["jeva"]
line_comments = ["// "]
block_comment = ["/*", "*/"]
tab_size = 2
autoclose_before = ";:.,=}])>\n\t"
brackets = [
  { start = "{", end = "}", close = true, newline = true },
  { start = "[", end = "]", close = true, newline = true },
  { start = "(", end = ")", close = true, newline = true },
  { start = "\"", end = "\"", close = true, newline = false, not_in = ["string", "comment"] },
  { start = "'", end = "'", close = true, newline = false, not_in = ["string", "comment"] }
]
